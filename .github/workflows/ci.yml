# Builds the host and the stock cppia host against libhxcpp's main branch, then runs the
# test harness, with neko as the oracle, on each system Nekomata supports
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The harness takes about 15 minutes; a build that waits on input would otherwise
    # hold the runner for 6 hours
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check out libhxcpp
        uses: actions/checkout@v7
        with:
          repository: openfl/libhxcpp
          path: libhxcpp

      # v2 installs neko on arm64 macOS as well, where v1 cannot
      - name: Install Haxe and neko
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      # Nekomata stands in for neko 2.4.1, whose $version and primitives it gives, and
      # setup-haxe installs 2.4.0, so the oracle is 2.4.1 from neko's release, first on
      # PATH. Its binaries find libneko beside them
      - name: Install neko 2.4.1
        run: |
          case "$RUNNER_OS" in
            Linux) name=neko-2.4.1-linux64; ext=tar.gz ;;
            macOS) name=neko-2.4.1-osx-arm64; ext=tar.gz ;;
            Windows) name=neko-2.4.1-win64; ext=zip ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/neko.$ext" "https://github.com/HaxeFoundation/neko/releases/download/v2-4-1/$name.$ext"
          if [ "$ext" = zip ]; then unzip -q "$RUNNER_TEMP/neko.$ext" -d "$RUNNER_TEMP"; else tar xzf "$RUNNER_TEMP/neko.$ext" -C "$RUNNER_TEMP"; fi
          dir="$RUNNER_TEMP/$name"
          if [ "$RUNNER_OS" = Windows ]; then dir=$(cygpath -w "$dir"); fi
          echo "$dir" >> "$GITHUB_PATH"
          echo "NEKOPATH=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$dir:$DYLD_FALLBACK_LIBRARY_PATH" >> "$GITHUB_ENV"

      # A source checkout of libhxcpp has no hxcpp.n until it is built, and haxelib run
      # hxcpp stops to ask for it
      - name: Point hxcpp at libhxcpp
        run: |
          haxelib newrepo
          haxelib dev hxcpp "$(pwd)/libhxcpp"
          (cd libhxcpp/tools/hxcpp && haxe compile.hxml)
          neko -version

      - name: Build the hosts
        run: |
          haxe build.hxml
          haxe cppia.hxml

      - name: Fetch the upstream test sources
        run: test/upstream/fetch.sh

      - name: Run the tests
        run: haxe test/harness.hxml -j 4
